<!doctype html><html lang="ku" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SNRZ AI V5</title><style>body{font-family:Arial;background:#0b0d10;color:#eee;margin:0}.wrap{max-width:1200px;margin:auto;padding:18px}.card{background:#151922;border:1px solid #2b3240;border-radius:16px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#242b38;margin:3px}.muted{color:#9da7b5}.tv{height:500px;border:0;width:100%;border-radius:12px}button{background:#d9b24c;border:0;padding:11px 16px;border-radius:10px;font-weight:bold}.zone{padding:7px;margin:4px 0;background:#202633;border-radius:8px}</style></head><body><div class="wrap"><h1>🧠 SNRZ AI V5</h1><div class="card"><b>SNRZ-only • Automatic Zone Detection • Paper/Educational</b><p class="muted">Zone ـەکان candidate ـن تا کاتێک هەموو بەڵگەی پێویست لە OHLC بەردەست بێت.</p><button onclick="run()">🔄 Analyze XAU/USD</button><h3 id="align">—</h3></div><div class="card"><h2>📈 XAUUSD</h2><iframe class="tv" src="https://www.tradingview.com/widgetembed/?symbol=OANDA%3AXAUUSD&interval=15&hidesidetoolbar=1&symboledit=1&saveimage=0&toolbarbg=f1f3f6&studies=[]&theme=dark&style=1&timezone=Etc%2FUTC"></iframe></div><div id="out" class="grid"></div><div class="card"><h2>📚 SNRZ Core</h2><span class="pill">V.S</span><span class="pill">V.R</span><span class="pill">I-VS</span><span class="pill">I-VR</span><span class="pill">RBS</span><span class="pill">SBR</span><span class="pill">SRR</span><span class="pill">RSS</span><span class="pill">PO2</span><span class="pill">Sweep</span><span class="pill">Run</span><span class="pill">False Breakout</span></div></div><script>function esc(s){return String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}async function run(){let o=document.getElementById('out');o.innerHTML='<div class="card">دەخەمە پشکنین...</div>';try{let d=await (await fetch('/api/multi-analysis')).json();document.getElementById('align').textContent='Structure alignment: '+d.structure_alignment;o.innerHTML=Object.entries(d.analysis).map(([tf,x])=>`<div class="card"><h3>${tf.toUpperCase()}</h3><b>${esc(x.status)}</b><p>Trend: ${esc(x.structure?.trend)}</p><p>${(x.reasons||[]).map(esc).join(' • ')||'No extra evidence'}</p><h4>Zones</h4>${(x.zones||[]).map(z=>`<div class="zone"><b>${esc(z.type)}</b> — ${Number(z.level).toFixed(3)} — touches: ${z.touches}${z.po2_candidate?' — PO2 candidate':''}</div>`).join('')||'No candidate zone'}</div>`).join('')}catch(e){o.innerHTML='<div class="card">هەڵە: '+esc(e)+'</div>'}}run();</script></body></html>
